name: Package desktop applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 1.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package for ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            package_type: dmg
            extension: dmg
          - name: Windows
            runner: windows-latest
            package_type: msi
            extension: msi
          - name: Linux
            runner: ubuntu-latest
            package_type: deb
            extension: deb

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set the package version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            app_version="${GITHUB_REF_NAME#v}"
          else
            app_version="${{ inputs.version }}"
          fi

          if ! printf '%s' "$app_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must use the form MAJOR.MINOR.PATCH, without a v prefix." >&2
            exit 1
          fi

          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install WiX for Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.11.2 --no-progress --yes
          $wix_bin = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin"
          if (!(Test-Path $wix_bin)) {
            throw "WiX was not installed at $wix_bin"
          }
          $wix_bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot

      - name: Compile application and create JAR
        shell: bash
        run: |
          mkdir -p build/ci/classes build/ci/input artifacts/native
          javac -d build/ci/classes SlidingPuzzle/*.java
          jar --create --file build/ci/input/SlidingPuzzle.jar --main-class Main -C build/ci/classes .

      - name: Create native installer
        shell: bash
        run: |
          jpackage \
            --type "${{ matrix.package_type }}" \
            --name SlidingPuzzle \
            --app-version "$APP_VERSION" \
            --input build/ci/input \
            --main-jar SlidingPuzzle.jar \
            --main-class Main \
            --dest artifacts/native

          package_path=$(find artifacts/native -maxdepth 1 -type f -name "*.${{ matrix.extension }}" -print -quit)
          test -n "$package_path"
          package_name="artifacts/native/SlidingPuzzle-${APP_VERSION}.${{ matrix.extension }}"
          if [ "$package_path" != "$package_name" ]; then
            mv "$package_path" "$package_name"
          fi

      - name: Create portable Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name SlidingPuzzle \
            --app-version "$APP_VERSION" \
            --input build/ci/input \
            --main-jar SlidingPuzzle.jar \
            --main-class Main \
            --dest build/ci/app-image
          tar -C build/ci/app-image -czf "artifacts/native/SlidingPuzzle-${APP_VERSION}-linux-x64.tar.gz" SlidingPuzzle

      - name: Verify macOS application version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "artifacts/native/SlidingPuzzle-${APP_VERSION}.dmg"
          test "$(plutil -extract CFBundleShortVersionString raw "$mount_dir/SlidingPuzzle.app/Contents/Info.plist")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw "$mount_dir/SlidingPuzzle.app/Contents/Info.plist")" = "$APP_VERSION"
          hdiutil detach "$mount_dir"

      - name: Upload ${{ matrix.name }} packages
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}-${{ steps.version.outputs.version }}
          path: artifacts/native/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
